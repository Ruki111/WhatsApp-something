[package]
name = "webhook-simulator"
version = "0.1.0"
edition = "2024"
description = "Sends fake Meta WhatsApp Cloud API webhooks, signed like Meta signs them"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
form_urlencoded = "1.2"
getrandom = "0.3"
hmac = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
